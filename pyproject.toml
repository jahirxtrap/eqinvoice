[project]
name = "eqinvoice"
version = "1.2.0"
description = "Every electronic voucher of Ecuador's SRI, from invoices to withholdings: build, sign, send, authorize and print, as a library or an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jahirtrap" }]
keywords = [
    "ecuador",
    "sri",
    "electronic invoice",
    "factura electronica",
    "comprobante de retencion",
    "guia de remision",
    "xades",
    "mcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=50.0.2",
    "fonttools>=4.68",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "reportlab>=5.1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3",
]
dev = [
    "mcp>=2.3",
    "mypy>=2.4.1",
    "pytest>=9.2",
    "ruff>=0.17.5",
]

[project.urls]
Homepage = "https://github.com/jahirxtrap/eqinvoice"
Repository = "https://github.com/jahirxtrap/eqinvoice"
Issues = "https://github.com/jahirxtrap/eqinvoice/issues"

[project.scripts]
eqinvoice-mcp = "eqinvoice_mcp.server:main"

[build-system]
requires = ["setuptools>=84.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eqinvoice = ["py.typed", "schemas/*.xsd", "labels/*.json"]
eqinvoice_mcp = ["icon.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
