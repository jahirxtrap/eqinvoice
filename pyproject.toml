[project]
name = "ecuador-einvoicing"
version = "1.0.0"
description = "Electronic invoices and credit notes for Ecuador's SRI: build, sign, send, authorize and print."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0",
    "httpx>=0.28",
    "lxml>=6.1",
    "reportlab>=5.1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3",
]
dev = [
    "mcp>=2.3",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[project.scripts]
ecuador-einvoicing-mcp = "ecuador_einvoicing_mcp.server:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecuador_einvoicing = ["py.typed", "schemas/*.xsd", "labels/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
